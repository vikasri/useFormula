<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>useFormula</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="site">
    <div class="logo" onclick="location.hash=''">use<span>Formula</span></div>
  </header>
  <div id="app"></div>
  <footer>
    Enter your known values and get the answer.
    <span class="disclaimer">Results are estimates for general information only.
    Check with additional professional resources before application.
    useFormula is not liable by any means.</span>
  </footer>
</div>

<!-- Site settings: on/off switches, edit this file to change what shows -->
<script src="js/settings.js"></script>

<!-- Engine: rendering, routing, calculation, sliders, charts -->
<script src="js/engine.js"></script>

<!-- Broad topics -->
<script src="js/topics.js"></script>

<!-- One file per topic: its formulas -->
<script src="js/finance.js"></script>
<script src="js/mechanics.js"></script>

<!-- Start the app once every topic's formulas are registered -->
<script src="js/boot.js"></script>
