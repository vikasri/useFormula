<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 228" role="img" aria-label="Four columns under an axial load P, each drawn with the shape it buckles into: pinned at both ends K equals 1, fixed at one end and free at the other K equals 2, fixed at both ends K equals 0.5, and fixed at one end and pinned at the other K about 0.7.">
  <defs>
    <marker id="p" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5f6e75"/></marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
    <g stroke="#263238" stroke-width="1" opacity="0.32" stroke-dasharray="3 3">
      <line x1="42" y1="40" x2="42" y2="160"/>
      <line x1="112" y1="40" x2="112" y2="160"/>
      <line x1="182" y1="40" x2="182" y2="160"/>
      <line x1="252" y1="40" x2="252" y2="160"/>
    </g>

    <g fill="none" stroke="#e76f51" stroke-width="2">
      <path d="M 42 40 C 60 72, 60 128, 42 160"/>
      <path d="M 130 40 C 116 70, 112 110, 112 160"/>
      <path d="M 182 40 C 182 75, 198 75, 198 100 C 198 125, 182 125, 182 160"/>
      <path d="M 252 40 C 264 58, 252 125, 252 160"/>
    </g>

    <g stroke="#5f6e75" stroke-width="1.35" marker-end="url(#p)">
      <line x1="42" y1="13" x2="42" y2="28"/>
      <line x1="130" y1="13" x2="130" y2="34"/>
      <line x1="182" y1="13" x2="182" y2="30"/>
      <line x1="252" y1="13" x2="252" y2="28"/>
    </g>
    <g fill="#5f6e75" font-size="10.5" font-style="italic">
      <text x="47" y="24">P</text><text x="135" y="24">P</text>
      <text x="187" y="24">P</text><text x="257" y="24">P</text>
    </g>

    <g fill="#263238" stroke="#263238" stroke-width="1.4">
      <path d="M 42 40 L 36 32 L 48 32 Z"/><path d="M 42 160 L 36 168 L 48 168 Z"/>
      <path d="M 252 40 L 246 32 L 258 32 Z"/>
    </g>
    <g stroke="#263238" stroke-width="1.6" fill="none">
      <line x1="32" y1="32" x2="52" y2="32"/><line x1="32" y1="168" x2="52" y2="168"/>
      <line x1="242" y1="32" x2="262" y2="32"/>
      <line x1="101" y1="160" x2="123" y2="160"/>
      <line x1="171" y1="40" x2="193" y2="40"/><line x1="171" y1="160" x2="193" y2="160"/>
      <line x1="241" y1="160" x2="263" y2="160"/>
    </g>
    <g stroke="#263238" stroke-width="1" fill="none" opacity="0.75">
      <path d="M105 160 l-4 6 M111 160 l-4 6 M117 160 l-4 6 M123 160 l-4 6"/>
      <path d="M175 40 l-4 -6 M181 40 l-4 -6 M187 40 l-4 -6 M193 40 l-4 -6"/>
      <path d="M175 160 l-4 6 M181 160 l-4 6 M187 160 l-4 6 M193 160 l-4 6"/>
      <path d="M245 160 l-4 6 M251 160 l-4 6 M257 160 l-4 6 M263 160 l-4 6"/>
    </g>

    <g fill="#5f6e75" font-size="9.5" text-anchor="middle">
      <text x="42" y="186">Pinned&#8211;pinned</text>
      <text x="112" y="186">Fixed&#8211;free</text>
      <text x="182" y="186">Fixed&#8211;fixed</text>
      <text x="252" y="186">Fixed&#8211;pinned</text>
    </g>
    <g fill="#2f6bff" font-size="11.5" font-weight="600" text-anchor="middle">
      <text x="42" y="201">K = 1</text>
      <text x="112" y="201">K = 2</text>
      <text x="182" y="201">K = 0.5</text>
      <text x="252" y="201">K &#8776; 0.7</text>
    </g>
    <text x="150" y="220" fill="#5f6e75" text-anchor="middle" font-size="11.5">The ends set K, and the effective length is KL.</text>
  </g>
</svg>
