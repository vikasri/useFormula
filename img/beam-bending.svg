<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 228" role="img" aria-label="A beam of span L carrying a downward point load P at a distance a from its left end, drawn sagging under the load, with a key showing the pinned, fixed and free end conditions the form offers.">
  <defs>
    <marker id="ld" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#e76f51"/></marker>
    <marker id="dm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2f6bff"/></marker>
    <marker id="fr" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5f6e75"/></marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
    <line x1="160" y1="34" x2="160" y2="68" stroke="#e76f51" stroke-width="1.8" marker-end="url(#ld)"/>
    <text x="166" y="48" fill="#e76f51" font-style="italic">P</text>

    <rect x="45" y="72" width="210" height="9" fill="#fbece6" stroke="#263238" stroke-width="1.5"/>
    <path d="M 45 81 C 100 102, 210 98, 255 81" fill="none" stroke="#e76f51"
          stroke-width="1.5" stroke-dasharray="4 3" opacity="0.85"/>

    <g fill="#263238" stroke="#263238" stroke-width="1.4">
      <path d="M 45 81 L 38 91 L 52 91 Z"/><path d="M 255 81 L 248 91 L 262 91 Z"/>
    </g>
    <g stroke="#263238" stroke-width="1.5">
      <line x1="34" y1="91" x2="56" y2="91"/><line x1="244" y1="91" x2="266" y2="91"/>
    </g>

    <g stroke="#263238" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.4">
      <line x1="45" y1="91" x2="45" y2="138"/>
      <line x1="160" y1="68" x2="160" y2="120"/>
      <line x1="255" y1="91" x2="255" y2="138"/>
    </g>
    <g stroke="#2f6bff" stroke-width="1.2" marker-start="url(#dm)" marker-end="url(#dm)">
      <line x1="45" y1="114" x2="160" y2="114"/>
      <line x1="45" y1="133" x2="255" y2="133"/>
    </g>
    <text x="102" y="110" fill="#2f6bff" text-anchor="middle" font-style="italic">a</text>
    <text x="150" y="129" fill="#2f6bff" text-anchor="middle" font-style="italic">L</text>

    <g stroke="#263238" stroke-width="1.4" fill="none">
      <rect x="56" y="162" width="24" height="5" fill="#fbece6"/>
      <path d="M 68 167 L 62 175 L 74 175 Z" fill="#263238"/>
      <line x1="58" y1="175" x2="78" y2="175"/>
      <rect x="140" y="162" width="24" height="5" fill="#fbece6"/>
      <line x1="140" y1="156" x2="140" y2="181"/>
      <rect x="216" y="162" width="24" height="5" fill="#fbece6"/>
    </g>
    <g stroke="#263238" stroke-width="0.9" fill="none" opacity="0.75">
      <path d="M140 160 l-5 -5 M140 167 l-5 -5 M140 174 l-5 -5 M140 181 l-5 -5"/>
    </g>
    <line x1="240" y1="171" x2="240" y2="182" stroke="#5f6e75" stroke-width="1.2" marker-end="url(#fr)"/>
    <g fill="#5f6e75" font-size="10.5" text-anchor="middle">
      <text x="68" y="192">Pinned</text>
      <text x="152" y="192">Fixed</text>
      <text x="228" y="192">Free</text>
    </g>
    <text x="150" y="209" fill="#5f6e75" text-anchor="middle" font-size="11.5">Each end is set on the form.</text>
    <text x="150" y="222" fill="#5f6e75" text-anchor="middle" font-size="11.5">a is measured from the left end.</text>
  </g>
</svg>
